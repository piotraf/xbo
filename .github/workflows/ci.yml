# CI on the lab's self-hosted runner (cidb01: OL8.10, MySQL 8.4, XtraBackup 8.4, python3.12).
# xbo is a placeholder today, so this is an environment + syntax + smoke-run gate. Grow it as xbo grows:
# next steps = run xbo against the local MySQL with a test config, then a backup/restore round-trip.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: [self-hosted, cidb]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain present (README requirements)
        run: |
          python3.12 --version
          python3.12 -c 'import pymysql; print("PyMySQL", pymysql.__version__)'
          xtrabackup --version 2>&1 | grep -o 'xtrabackup version [^ ]*'

      - name: MySQL reachable
        run: sudo mysql -Nse 'SELECT VERSION()'

      - name: xbo compiles
        run: python3.12 -m py_compile xbo

      - name: xbo runs and finds xtrabackup
        run: |
          rm -f /tmp/xbo_hello_world.txt
          python3.12 xbo
          cat /tmp/xbo_hello_world.txt
          grep -q '^xtrabackup: /usr/bin/xtrabackup$' /tmp/xbo_hello_world.txt
