# CI on the lab's self-hosted runner cidb01 (OL8.10, MySQL 8.4, XtraBackup 8.4, python3.12).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, cidb]
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain present (README requirements)
        run: |
          python3.12 --version
          xtrabackup --version 2>&1 | grep -o 'xtrabackup version [^ ]*'

      - name: MySQL reachable
        run: sudo mysql -Nse 'SELECT VERSION()'

      - name: Install package + dev tools (venv)
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'

      - name: Lint + format check (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Unit tests (pytest)
        run: .venv/bin/pytest -q

      - name: xbo runs against the real MySQL/XtraBackup
        run: |
          out=/tmp/xbo_hello_world_$(id -un).txt
          rm -f "$out"
          .venv/bin/xbo --version
          .venv/bin/xbo --xtrabackup /usr/bin/xtrabackup   # rpm layout on cidb01, not /opt/xtrabackup-<ver>
          cat "$out"
          grep -q '^xtrabackup: /usr/bin/xtrabackup$' "$out"
